[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliabilityml"
version = "1.0.0"
description = "AI incident intelligence and MLOps on synthetic telemetry: detection, classification, SLOs, cited RAG, drift, deployment gate"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "prometheus-client>=0.20",
  "matplotlib>=3.8",
  "anthropic>=1.0",
]

[project.optional-dependencies]
mlops = ["mlflow>=2.14", "prefect>=2.19"]
otel = ["opentelemetry-sdk>=1.24", "opentelemetry-exporter-otlp-proto-http>=1.24", "opentelemetry-instrumentation-fastapi>=0.45b0"]
embeddings = ["sentence-transformers>=2.7"]
gcp = ["google-cloud-storage>=2.16"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reliabilityml = ["static/**/*", "rag/prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM108", "E501", "B905"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
