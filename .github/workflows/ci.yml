name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - name: Tests (runs the full pipeline once, then unit, leakage, RAG, API contract and gate tests)
        run: pytest --cov=reliabilityml --cov-report=term-missing
        env:
          RELIABILITYML_TEST_ARTIFACTS: ${{ runner.temp }}/artifacts
      - name: Deployment gate (same checks as POST /validate-deployment)
        run: python -m reliabilityml.gate.validate --scenario clean_release --tests-passed true --artifacts ${{ runner.temp }}/artifacts
      - name: Gate must block a bad release
        run: "! python -m reliabilityml.gate.validate --scenario latency_regression --tests-passed true --artifacts ${{ runner.temp }}/artifacts"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  image:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t reliabilityml .
      - name: Smoke test the image
        run: |
          docker run -d -p 8000:8000 --name rml reliabilityml
          for i in $(seq 1 40); do curl -fs localhost:8000/health && exit 0; sleep 2; done
          docker logs rml; exit 1
