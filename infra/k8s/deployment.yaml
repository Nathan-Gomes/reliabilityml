# Optional: run the API on a local kind/minikube cluster.
#   kind create cluster && docker build -t reliabilityml:local ../.. && kind load docker-image reliabilityml:local
#   kubectl apply -f .
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reliabilityml-api
  labels: {app: reliabilityml-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: reliabilityml-api}
  template:
    metadata:
      labels: {app: reliabilityml-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: reliabilityml:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: reliabilityml-api
spec:
  selector: {app: reliabilityml-api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reliabilityml-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: reliabilityml-api}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
