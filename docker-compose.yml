# Local stack: API + console, Prometheus, Grafana (four provisioned dashboards), Jaeger for traces,
# and an MLflow server for browsing experiment runs and the model registry.
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      REPLAY_SECONDS_PER_MINUTE: "5"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      RELIABILITYML_ANTHROPIC_API_KEY: ${RELIABILITYML_ANTHROPIC_API_KEY:-}
    command: >
      sh -c "pip install --no-cache-dir -q opentelemetry-sdk opentelemetry-exporter-otlp-proto-http opentelemetry-instrumentation-fastapi &&
             uvicorn reliabilityml.api.main:app --host 0.0.0.0 --port 8000"
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./dashboards/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./dashboards/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/slo.json
    volumes:
      - ./dashboards/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards/grafana/json:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
  jaeger:
    image: jaegertracing/all-in-one:1.58
    ports: ["16686:16686"]
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlruns/mlflow.db --default-artifact-root /mlruns/artifacts
    volumes: ["./artifacts/registry:/mlruns"]
    ports: ["5000:5000"]
